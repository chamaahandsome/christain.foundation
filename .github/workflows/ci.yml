name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy URL — prisma validate/generate never connect to a database.
  DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
